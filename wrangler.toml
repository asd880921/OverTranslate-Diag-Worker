name = "overtranslate-diag"
main = "src/index.js"
compatibility_date = "2026-08-21"

# Where the bundles land. Nothing about retention is configured here: the worker sets a 30-day
# expiry on every key as it writes it, which is one fewer thing that has to have been remembered
# separately for this store not to become a permanent pile of other people's screen text.
#
# `wrangler dev` writes to a local store rather than this one unless it is given --remote, so
# experimenting does not put anything in front of a real report.
[[kv_namespaces]]
binding = "BUNDLES"
id = "REPLACE_WITH_NAMESPACE_ID"

# Per-IP rate limiting. Still under `unsafe` in wrangler's schema, which is why the worker treats a
# missing binding as "no limit" rather than falling over.
#
# Five a minute: a person collecting a bug report presses the button once, twice if the first
# attempt failed. Anything past five is not that person.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
